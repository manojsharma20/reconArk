openapi: 3.1.0
info:
  title: reconArk common components
  version: 1.0.0
paths: {}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; a repeated request with the same key returns the original response.
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains stack traces or internal identifiers.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, pattern: '^RK-[A-Z]{3}-[0-9]{4}$', examples: ['RK-KRN-0012'] }
      required: [title, status]
    Page:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
