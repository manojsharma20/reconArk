# recon-worker — Executes batch recon buckets and streaming matches with the configured rule sets.
spring:
  application:
    name: recon-worker
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:./config/composition/recon-worker.yaml
server:
  port: ${PORT:8093}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,plugins,prometheus
  endpoint:
    health:
      probes:
        enabled: true
reconark:
  security:
    dev-mode: ${RECONARK_DEV_MODE:false}
  composition:
    environment: ${RECONARK_ENV:local}
    enabled:
      - recon-standard
      - bus-inmemory
