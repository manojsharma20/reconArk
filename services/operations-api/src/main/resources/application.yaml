# operations-api — Internal-only operations: runs, DLQ, plugin inventory and health.
spring:
  application:
    name: operations-api
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:./config/composition/operations-api.yaml
server:
  port: ${PORT:8085}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,plugins,prometheus
  endpoint:
    health:
      probes:
        enabled: true
reconark:
  security:
    dev-mode: ${RECONARK_DEV_MODE:false}
  composition:
    environment: ${RECONARK_ENV:local}
    enabled: []
