# outbox-relay — Publishes committed outbox events, in order, through the active message bus.
spring:
  application:
    name: outbox-relay
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:./config/composition/outbox-relay.yaml
server:
  port: ${PORT:8095}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,plugins,prometheus
  endpoint:
    health:
      probes:
        enabled: true
reconark:
  security:
    dev-mode: ${RECONARK_DEV_MODE:false}
  composition:
    environment: ${RECONARK_ENV:local}
    enabled:
      - bus-inmemory
