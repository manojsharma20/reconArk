# scheduler — Planner, admission control, fair scheduling, heartbeat reclaimer, partition maintenance.
spring:
  application:
    name: scheduler
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:./config/composition/scheduler.yaml
server:
  port: ${PORT:8091}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,plugins,prometheus
  endpoint:
    health:
      probes:
        enabled: true
reconark:
  security:
    dev-mode: ${RECONARK_DEV_MODE:false}
  composition:
    environment: ${RECONARK_ENV:local}
    enabled:
      - bus-inmemory
