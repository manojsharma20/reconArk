# etl-worker — Executes ETL chunks through the provider's configured stage pipeline.
spring:
  application:
    name: etl-worker
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:./config/composition/etl-worker.yaml
server:
  port: ${PORT:8092}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,plugins,prometheus
  endpoint:
    health:
      probes:
        enabled: true
reconark:
  security:
    dev-mode: ${RECONARK_DEV_MODE:false}
  composition:
    environment: ${RECONARK_ENV:local}
    enabled:
      - core-stages
      - format-delimited
      - bus-inmemory
      - storage-filesystem
      - secrets-env
