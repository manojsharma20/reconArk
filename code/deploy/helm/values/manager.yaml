# helm upgrade --install manager deploy/helm/reconark-service -f deploy/helm/values/manager.yaml
name: manager
image: { repository: ghcr.io/manojsharma20/reconark-manager, tag: "0.3.0" }
port: 8090
env:
  CONFIG_SERVICE_URL: http://config-service:8081
  INGESTION_SERVICE_URL: http://ingestion-service:8082
  DB_URL: jdbc:postgresql://reconark-db:5432/reconark
  DB_USER: reconark
  KAFKA_BOOTSTRAP_SERVERS: reconark-kafka:9092
secretEnv:
  DB_PASSWORD: { secret: reconark-db, key: password }
# One manager is enough; a second one is safe (database locks) and gives high availability.
replicas: 2
