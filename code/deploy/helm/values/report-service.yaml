# helm upgrade --install report-service deploy/helm/reconark-service -f deploy/helm/values/report-service.yaml
name: report-service
image: { repository: ghcr.io/manojsharma20/reconark-report-service, tag: "0.3.0" }
port: 8083
env:
  DB_URL: jdbc:postgresql://reconark-db:5432/reconark
  DB_USER: reconark
  KAFKA_BOOTSTRAP_SERVERS: reconark-kafka:9092
secretEnv:
  DB_PASSWORD: { secret: reconark-db, key: password }
