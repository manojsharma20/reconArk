# helm upgrade --install ingestion-service deploy/helm/reconark-service -f deploy/helm/values/ingestion-service.yaml
name: ingestion-service
image: { repository: ghcr.io/manojsharma20/reconark-ingestion-service, tag: "0.3.0" }
port: 8082
env:
  STORAGE_ROOT: /data/files
  DB_URL: jdbc:postgresql://reconark-db:5432/reconark
  DB_USER: reconark
  KAFKA_BOOTSTRAP_SERVERS: reconark-kafka:9092
secretEnv:
  DB_PASSWORD: { secret: reconark-db, key: password }
sharedFiles: { enabled: true }
