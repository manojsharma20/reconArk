# reconArk on one machine.
#
#   Infrastructure only (run the services from your IDE):  docker compose up -d
#   Everything (build jars + frontend first, see start.sh): docker compose --profile app up -d --build
#
# Addresses: UI http://localhost:8080 · Grafana http://localhost:3000 · Prometheus http://localhost:9090
#            Kafka UI http://localhost:8085 · PostgreSQL localhost:5432 · Kafka localhost:9092
# Local-only credentials: never reuse them anywhere else.

name: reconark

x-java-service: &java-service
  profiles: [app]
  restart: unless-stopped
  environment: &java-env
    DB_URL: jdbc:postgresql://postgres:5432/reconark
    DB_USER: reconark
    DB_PASSWORD: reconark
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    STORAGE_ROOT: /data/files
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: reconark
      POSTGRES_USER: reconark
      POSTGRES_PASSWORD: reconark
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reconark -d reconark']
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ['9092:9094']   # from your machine: localhost:9092
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ['8085:8080']
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']   # to scrape services you run from your IDE

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/reconark.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [prometheus]

  # ---------------------------------------------------------------- reconArk (profile "app")
  config-service:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/java-service.Dockerfile, args: { MODULE: backend/services/config-service } }
    ports: ['8081:8081']

  ingestion-service:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/java-service.Dockerfile, args: { MODULE: backend/services/ingestion-service } }
    ports: ['8082:8082']
    volumes: [files:/data/files]

  report-service:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/java-service.Dockerfile, args: { MODULE: backend/services/report-service } }
    ports: ['8083:8083']
    depends_on:
      postgres: { condition: service_healthy }
      manager: { condition: service_started }   # the manager creates the engine tables

  manager:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/java-service.Dockerfile, args: { MODULE: recon-engine/manager } }
    environment:
      <<: *java-env
      CONFIG_SERVICE_URL: http://config-service:8081
      INGESTION_SERVICE_URL: http://ingestion-service:8082
    ports: ['8090:8090']

  worker:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/java-service.Dockerfile, args: { MODULE: recon-engine/worker } }
    volumes: [files:/data/files]
    deploy:
      replicas: 2   # scale with: docker compose --profile app up -d --scale worker=4

  frontend:
    profiles: [app]
    build: { context: .., dockerfile: deploy/docker/frontend.Dockerfile }
    ports: ['8080:8080']
    depends_on: [config-service, ingestion-service, report-service, manager]

volumes:
  postgres-data:
  files:
