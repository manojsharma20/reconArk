# Prometheus collects metrics from every reconArk service every 15 seconds (/actuator/prometheus).
global:
  scrape_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config-service:8081', 'ingestion-service:8082', 'report-service:8083', 'manager:8090']

  # Workers can be scaled to many copies: DNS returns every copy's address.
  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8091

  # Services started from your IDE instead of docker compose.
  - job_name: local-ide
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8082', 'host.docker.internal:8083',
                  'host.docker.internal:8090', 'host.docker.internal:8091']
