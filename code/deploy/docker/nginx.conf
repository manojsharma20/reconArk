# Serves the React app and sends each /api path to the service that owns it.
server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 2g;   # file uploads

    location /api/definitions { proxy_pass http://config-service:8081; }
    location /api/plugins     { proxy_pass http://config-service:8081; }
    location /api/files       { proxy_pass http://ingestion-service:8082; proxy_request_buffering off; }
    location /api/reports     { proxy_pass http://report-service:8083; proxy_read_timeout 30m; proxy_buffering off; }
    location /api/runs        { proxy_pass http://manager:8090; }

    # Single-page app: unknown paths load index.html, React Router takes over.
    location / {
        try_files $uri /index.html;
    }
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
