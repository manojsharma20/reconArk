# recon-engine worker. Scale by running more copies; each copy runs `reconark.worker.concurrency` jobs at a time.
server:
  port: ${PORT:8091}
  shutdown: graceful

spring:
  application:
    name: recon-worker
  threads:
    virtual:
      enabled: true
  datasource:
    # reWriteBatchedInserts makes the PostgreSQL driver send batches as multi-row inserts: much faster loads.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconark}?reWriteBatchedInserts=true
    username: ${DB_USER:reconark}
    password: ${DB_PASSWORD:reconark}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
      # One job at a time per consumer, and allow a long job (a big file) before Kafka assumes the worker is dead.
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 3600000
        allow.auto.create.topics: false   # topics are declared by the services, with the right partitions
        metadata.max.age.ms: 30000        # notice new partitions quickly

reconark:
  worker:
    concurrency: 2
  kafka:
    partitions: 12   # used only if the worker starts before the manager and creates the topics
    replicas: 1
  plugins:
    storage-local:
      root: ${STORAGE_ROOT:${java.io.tmpdir}/reconark/files}   # must be the same folder ingestion-service writes

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
