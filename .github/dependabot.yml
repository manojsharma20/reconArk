version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /tools/docs-lint
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
