name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (backend + recon-engine, unit and integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Integration tests start PostgreSQL in Docker (Testcontainers); GitHub runners have Docker.
      - run: ./gradlew build --continue --no-daemon
      - name: Show failed tests as annotations
        if: failure()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for problem in list(case.iter('failure')) + list(case.iter('error')):
                      lines = (problem.text or problem.get('message') or '').splitlines()
                      keep = lines[:6] + [l for l in lines if l.startswith('Caused by')][-3:]
                      text = '\n'.join(keep)[:2000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: 'code/**/build/reports/tests/'

  frontend:
    name: Frontend (typecheck, tests, build, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  deploy:
    name: Deploy files (docker compose config, Helm lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f code/deploy/docker-compose.yml --profile app config --quiet
      - uses: azure/setup-helm@v4
      - run: |
          for values in code/deploy/helm/values/*.yaml; do
            helm lint code/deploy/helm/reconark-service -f "$values"
          done

  docs:
    name: Docs (Mermaid diagrams parse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/_lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
